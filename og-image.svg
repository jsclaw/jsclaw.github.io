<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF9F5"/>
  <ellipse cx="380" cy="-120" rx="700" ry="300" fill="#F6EFE8"/>

  <!-- Logo mark -->
  <rect x="84" y="92" width="58" height="58" rx="13" fill="#24231F"/>
  <text x="113" y="130" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="25" fill="#C15F3C">&gt;_</text>
  <text x="162" y="133" font-family="Georgia, serif" font-size="44" font-weight="600" fill="#161614">jsclaw</text>

  <!-- Headline -->
  <text x="86" y="248" font-family="Georgia, serif" font-size="58" fill="#161614">Claude agents, each in</text>
  <text x="86" y="318" font-family="Georgia, serif" font-size="58" font-style="italic" fill="#C15F3C">its own container.</text>

  <!-- Sub -->
  <text x="87" y="372" font-family="-apple-system, Helvetica, sans-serif" font-size="23" fill="#63615C">Gateway · Nostr DMs · heartbeat autonomy · zero deps</text>

  <!-- Install pill -->
  <rect x="84" y="420" width="350" height="58" rx="29" fill="#24231F"/>
  <text x="112" y="457" font-family="monospace" font-size="20" fill="#7D9B76">$</text>
  <text x="134" y="457" font-family="monospace" font-size="20" fill="#ECEAE2">npm install jsclaw</text>

  <!-- Stats -->
  <text x="86" y="552" font-family="Georgia, serif" font-size="30" fill="#161614">0</text>
  <text x="86" y="576" font-family="-apple-system, sans-serif" font-size="13" letter-spacing="1" fill="#8A877D">DEPENDENCIES</text>
  <line x1="222" y1="528" x2="222" y2="578" stroke="#E5E2D9" stroke-width="1.5"/>
  <text x="246" y="552" font-family="Georgia, serif" font-size="30" fill="#161614">~57 kB</text>
  <text x="246" y="576" font-family="-apple-system, sans-serif" font-size="13" letter-spacing="1" fill="#8A877D">INSTALLED</text>
  <line x1="400" y1="528" x2="400" y2="578" stroke="#E5E2D9" stroke-width="1.5"/>
  <text x="424" y="552" font-family="Georgia, serif" font-size="30" fill="#161614">109</text>
  <text x="424" y="576" font-family="-apple-system, sans-serif" font-size="13" letter-spacing="1" fill="#8A877D">TESTS</text>
  <line x1="520" y1="528" x2="520" y2="578" stroke="#E5E2D9" stroke-width="1.5"/>
  <text x="544" y="552" font-family="Georgia, serif" font-size="30" fill="#161614">jsclaw.dev</text>
  <text x="544" y="576" font-family="-apple-system, sans-serif" font-size="13" letter-spacing="1" fill="#8A877D">PURE JAVASCRIPT · MIT</text>

  <!-- Right: stacked module cards -->
  <rect x="790" y="120" width="330" height="404" rx="16" fill="#FFFFFF" stroke="#E5E2D9" stroke-width="1.5"/>
  <text x="955" y="106" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#C15F3C">HOST → CONTAINER</text>

  <rect x="812" y="144" width="286" height="52" rx="10" fill="#F3E5DD"/>
  <text x="955" y="170" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#161614">container-runner</text>
  <text x="955" y="188" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#63615C">spawn · stream · isolate</text>

  <rect x="812" y="208" width="286" height="52" rx="10" fill="#F3E5DD"/>
  <text x="955" y="234" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#161614">heartbeat · scheduler</text>
  <text x="955" y="252" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#63615C">autonomy on a timer</text>

  <rect x="812" y="272" width="286" height="52" rx="10" fill="#F3E5DD"/>
  <text x="955" y="298" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#161614">skills · memory</text>
  <text x="955" y="316" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#63615C">SKILL.md · markdown context</text>

  <line x1="826" y1="338" x2="1084" y2="338" stroke="#E5E2D9" stroke-width="1.2" stroke-dasharray="4,4"/>

  <rect x="812" y="352" width="286" height="52" rx="10" fill="#E9EFE4"/>
  <text x="955" y="378" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#161614">agent-runner</text>
  <text x="955" y="396" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#63615C">drives the Claude SDK</text>

  <rect x="812" y="416" width="286" height="52" rx="10" fill="#E9EFE4"/>
  <text x="955" y="442" text-anchor="middle" font-family="monospace" font-size="16" font-weight="600" fill="#161614">mcp-server</text>
  <text x="955" y="460" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#63615C">send_message · schedule_task</text>

  <text x="955" y="502" text-anchor="middle" font-family="monospace" font-size="13" fill="#8A877D">SOUL.md · HEARTBEAT.md · memory/</text>
</svg>
